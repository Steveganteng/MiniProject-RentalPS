<section class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 420px;">
    <h1 class="h3 mb-4 text-center fw-bold">Daftar</h1>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmitHandler()">
      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="alert alert-success" role="alert">
        {{ successMessage }}
      </div>

      <div class="mb-3">
        <label for="name" class="form-label">Nama</label>
        <input
          id="name"
          formControlName="name"
          type="text"
          class="form-control"
          placeholder="Masukkan nama"
          maxlength="100"
        />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          class="form-control"
          placeholder="Masukkan email"
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          class="form-control"
          placeholder="Masukkan password"
          autocomplete="new-password"
        />
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label">Konfirmasi password</label>
        <input
          id="confirmPassword"
          formControlName="confirmPassword"
          type="password"
          class="form-control"
          placeholder="Ulangi password"
          autocomplete="new-password"
        />
        <div
          *ngIf="registerForm.hasError('passwordMismatch') && registerForm.controls.confirmPassword.touched"
          class="text-danger small mt-1"
        >
          Password dan konfirmasi password tidak cocok.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Memproses...' : 'Daftar' }}
      </button>

      <p class="mt-3 mb-0 text-center">
        <a routerLink="/login" class="text-decoration-none">
          <span class="text-dark">Sudah punya akun?</span> login disini
        </a>
      </p>
    </form>
  </div>
</section>
