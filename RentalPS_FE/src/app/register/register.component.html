<section class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm p-4" style="width: 100%; max-width: 420px;">
    <h1 class="h3 mb-4 text-center fw-bold">Daftar</h1>

    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Nama</label>
        <input 
          id="name" 
          name="name" 
          type="text" 
          class="form-control" 
          placeholder="Masukkan nama" 
          required
        >
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input 
          id="email" 
          name="email" 
          type="email" 
          class="form-control" 
          placeholder="Masukkan email" 
          required
        >
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label">Nomor telepon</label>
        <input 
          id="phone" 
          name="phone" 
          type="tel" 
          class="form-control" 
          placeholder="Masukkan nomor telepon" 
          required
        >
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input 
          id="password" 
          name="password" 
          type="password" 
          class="form-control" 
          placeholder="Masukkan password" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary w-100">Daftar</button>

      <p class="mt-3 mb-0 text-center">
        <a routerLink="/login" class="text-decoration-none">
          <span class="text-dark">Sudah punya akun?</span> login disini
        </a>
      </p>
    </form>
  </div>
</section>
