<h2>Jenis Ruangan</h2>

<p *ngIf="isLoading">Memuat data...</p>
<p *ngIf="errorMessage">{{ errorMessage }}</p>

<table
  *ngIf="!isLoading && !errorMessage"
  class="table table-striped"
>
  <thead>
    <tr>
      <th>Nama Ruangan</th>
      <th>Tarif Tambahan per Jam</th>
      <th>Deskripsi</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let item of roomTypes">
      <td>{{ item.name }}</td>
      <td>{{ item.additionalHourlyRate | currency:'IDR':'symbol':'1.0-0':'id-ID' }}</td>
      <td>{{ item.description }}</td>
      <td>{{ item.isActive ? 'Aktif' : 'Tidak aktif' }}</td>
    </tr>

    <tr *ngIf="roomTypes.length === 0">
      <td colspan="4">Belum ada data jenis ruangan.</td>
    </tr>
  </tbody>
</table>
